apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-official
  namespace: flux-system
spec:
  interval: 1h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 10m
  releaseName: alloy
  targetNamespace: monitoring
  install:
    createNamespace: true
  chart:
    spec:
      chart: alloy
      version: "1.13.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-official
  values:
    crds:
      create: false

    # El default reserva 50Mi por nodo para el sidecar que recarga la config
    configReloader:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 64Mi

    controller:
      type: daemonset
      # Para leer también los logs del control-plane (grupo5-1)
      tolerations:
        - effect: NoSchedule
          operator: Exists

    alloy:
      mounts:
        varlog: true
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
      configMap:
        content: |
          // Pods del nodo donde corre este Alloy (HOSTNAME = spec.nodeName)
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            // app = el primero que exista de: app.kubernetes.io/name, app, k8s-app
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_label_k8s_app"]
              separator     = ";"
              regex         = "^;*([^;]+).*$"
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
          }

          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pods.receiver]
          }

          // Formato de log de containerd
          loki.process "pods" {
            stage.cri {}
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
            }
          }
