apiVersion: v1
kind: Namespace
metadata:
  name: cassandra
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8ssandra
  namespace: flux-system
spec:
  interval: 1h
  url: https://helm.k8ssandra.io/stable
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cass-operator
  namespace: cassandra
spec:
  interval: 10m
  chart:
    spec:
      chart: cass-operator
      version: "0.67.2"
      sourceRef:
        kind: HelmRepository
        name: k8ssandra
        namespace: flux-system
  values:
    admissionWebhooks:
      enabled: false
