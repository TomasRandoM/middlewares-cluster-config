apiVersion: cassandra.datastax.com/v1beta1
kind: CassandraDatacenter
metadata:
  name: dc1
  namespace: cassandra
spec:
  clusterName: clusterCassandra
  serverType: cassandra
  serverVersion: "4.1.8"

  size: 3

  managementApiAuth:
    insecure: {}

  storageConfig:
    cassandraDataVolumeClaimSpec:
      storageClassName: cassandra-cinder-retain
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 4Gi

  racks:
    - name: rack1

  config:
    jvm-server-options:
      initial_heap_size: "1G"
      max_heap_size: "1G"
    cassandra-yaml:
      num_tokens: 16
      authenticator: PasswordAuthenticator
      authorizer: CassandraAuthorizer
      role_manager: CassandraRoleManager
