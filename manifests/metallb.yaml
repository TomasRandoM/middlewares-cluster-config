apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 1h
  url: https://metallb.github.io/metallb
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  releaseName: metallb
  targetNamespace: metallb-system
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
  values:
    # El clúster usa anuncios Layer 2; no necesita los backends BGP.
    frrk8s:
      enabled: false
    speaker:
      frr:
        enabled: false
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: twitter-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.66.50.2-10.66.50.9
  autoAssign: false
  serviceAllocation:
    namespaces:
      - twitter
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: twitter-pool
  namespace: metallb-system
spec:
  ipAddressPools:
    - twitter-pool
