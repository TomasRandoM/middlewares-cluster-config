---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: seaweedfs-s3
  namespace: monitoring
spec:
  module: tcp_connect
  interval: 30s
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static: ["seaweedfs-s3.seaweedfs.svc:8333"]
      labels:
        servicio: seaweedfs-s3
