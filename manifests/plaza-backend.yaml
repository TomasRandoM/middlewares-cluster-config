# Gestionado por Flux. El Secret se administra fuera de Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: plaza-backend-config
  namespace: plaza
data:
  SPRING_PROFILES_ACTIVE: prod,cassandra
  CASSANDRA_CONTACT_POINTS: clustercassandra-dc1-service.cassandra.svc.cluster.local
  CASSANDRA_PORT: "9042"
  CASSANDRA_LOCAL_FORWARD: "false"
  CASSANDRA_LOCAL_DATACENTER: dc1
  CASSANDRA_KEYSPACE: plaza
  STORAGE_S3_ENABLED: "true"
  STORAGE_S3_ENDPOINT: http://plaza-s3-gateway.seaweedfs.svc.cluster.local:8333
  STORAGE_S3_REGION: us-east-1
  STORAGE_S3_BUCKET: plaza
  CORS_ALLOWED_ORIGINS: http://localhost:5173
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plaza-backend
  namespace: plaza
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plaza-backend
  template:
    metadata:
      labels:
        app: plaza-backend
    spec:
      containers:
        - name: backend
          image: joacor7/plaza-api:v1 # {"$imagepolicy": "flux-system:plaza-backend"}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: plaza-backend-config
            - secretRef:
                name: plaza-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 65
---
apiVersion: v1
kind: Service
metadata:
  name: plaza-backend
  namespace: plaza
spec:
  selector:
    app: plaza-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
