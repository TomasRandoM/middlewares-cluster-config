apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: prometheus-cinder-retain
provisioner: cinder.csi.openstack.org
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    grafana:
      enabled: false
      # Crea los ConfigMaps de dashboards igual; los carga el sidecar del Grafana de grafana.yaml
      forceDeployDashboards: true
      sidecar:
        dashboards:
          annotations:
            grafana_folder: Kubernetes

    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false

    alertmanager:
      alertmanagerSpec:
        replicas: 1
        # Secret creado a mano, fuera de Git (claves bot-token y chat-id). Tiene que existir antes del despliegue.
        secrets:
          - alertmanager-telegram
        resources:
          requests:
            cpu: 5m
            memory: 64Mi
          limits:
            memory: 128Mi
      config:
        route:
          group_by: [alertname, namespace]
          receiver: telegram
          routes:
            - receiver: "null"
              matchers: ['alertname = "Watchdog"']
            - receiver: "null"
              matchers: ['alertname = "InfoInhibitor"']
            - receiver: "null"
              matchers: ['severity = "info"']
            # Síntomas de la lentitud de etcd: a Telegram solo si son critical
            - receiver: "null"
              matchers:
                - alertname =~ "KubeAPIErrorBudgetBurn|KubeAPITerminatedRequests|KubeClientErrors|KubeAPILatencyHigh|KubeAggregatedAPIErrors"
                - severity = "warning"
        receivers:
          - name: "null"
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
                parse_mode: HTML
                message: '{{ template "telegram.es.message" . }}'
                send_resolved: true
      templateFiles:
        telegram.tmpl: |-
          {{ define "telegram.es.message" -}}
          {{ if eq .Status "firing" }}🔥 <b>{{ len .Alerts.Firing }} alerta(s) activa(s)</b>{{ else }}✅ <b>Resuelta</b>{{ end }} · <b>{{ .CommonLabels.alertname | html }}</b>
          {{ range $i, $a := .Alerts }}{{ if lt $i 10 }}
          {{ if eq $a.Labels.severity "critical" }}🔴{{ else if eq $a.Labels.severity "warning" }}🟠{{ else }}🔵{{ end }} <b>{{ or $a.Annotations.summary $a.Labels.alertname | html }}</b>
          {{- with $a.Annotations.description }}
          {{ . | html }}{{ end }}
          <i>{{ with $a.Labels.namespace }}ns={{ . | html }} {{ end }}{{ with $a.Labels.pod }}pod={{ . | html }} {{ end }}{{ with $a.Labels.deployment }}deployment={{ . | html }} {{ end }}{{ with $a.Labels.instance }}instancia={{ . | html }} {{ end }}severidad={{ $a.Labels.severity | html }}</i>
          🕒 {{ ($a.StartsAt | tz "America/Argentina/Buenos_Aires").Format "02/01 15:04" }}{{ if eq $a.Status "resolved" }} → {{ ($a.EndsAt | tz "America/Argentina/Buenos_Aires").Format "02/01 15:04" }}{{ end }}
          {{ end }}{{ end }}{{ if gt (len .Alerts) 10 }}
          … mostrando 10 de {{ len .Alerts }}{{ end }}
          {{- end }}

    prometheus:
      prometheusSpec:
        replicas: 1
        shards: 1
        retention: 7d
        retentionSize: 8GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: prometheus-cinder-retain
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
        resources:
          requests:
            cpu: 100m
            memory: 400Mi
          limits:
            memory: 1536Mi

        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 200Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      # Estado de los recursos de Flux como métrica gotk_resource_info (de fluxcd/flux2-monitoring-example)
      rbac:
        extraRules:
          - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
            resources: [gitrepositories, helmrepositories, helmcharts, ocirepositories, kustomizations, helmreleases]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind: {group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Kustomization resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
              - groupVersionKind: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRelease resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
                      chart_name: [status, history, "0", chartName]
                      chart_app_version: [status, history, "0", appVersion]
                      chart_ref_name: [spec, chartRef, name]
                      chart_source_name: [spec, chart, spec, sourceRef, name]
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux GitRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmChart}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmChart resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      chart_name: [spec, chart]
                      chart_version: [spec, version]
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: OCIRepository}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux OCIRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
