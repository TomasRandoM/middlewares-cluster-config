apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: seaweedfs-cinder-retain
provisioner: cinder.csi.openstack.org
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: seaweedfs
  namespace: flux-system
spec:
  interval: 1h
  url: https://seaweedfs.github.io/seaweedfs/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  interval: 10m
  chart:
    spec:
      chart: seaweedfs
      version: "4.48.0"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
  values:
    global:
      seaweedfs:
        enableReplication: true
        # 001: una copia extra en otro volume server
        replicationPlacement: "001"

    master:
      replicas: 1
      data:
        type: persistentVolumeClaim
        size: 1Gi
        storageClass: seaweedfs-cinder-retain
      logs:
        type: emptyDir
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi

    volume:
      replicas: 2
      dataDirs:
        - name: data1
          type: persistentVolumeClaim
          size: 10Gi
          storageClass: seaweedfs-cinder-retain
          maxVolumes: 0
      logs:
        type: emptyDir
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

    filer:
      replicas: 1
      data:
        type: persistentVolumeClaim
        size: 2Gi
        storageClass: seaweedfs-cinder-retain
      logs:
        type: emptyDir
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      # Gateway S3 embebido en el filer (puerto 8333)
      s3:
        enabled: true
        enableAuth: false
