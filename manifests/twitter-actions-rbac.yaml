apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-deployer
  namespace: twitter
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-deployer
  namespace: twitter
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [twitter-backend]
    verbs: [get, list, patch, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deployer
  namespace: twitter
subjects:
  - kind: ServiceAccount
    name: github-actions-deployer
    namespace: twitter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-actions-deployer
