# Gestionado por Flux. El Secret se administra fuera de Git.
apiVersion: v1
kind: Namespace
metadata:
  name: twitter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: twitter-backend-config
  namespace: twitter
data:
  SPRING_PROFILES_ACTIVE: prod,cassandra
  CASSANDRA_CONTACT_POINTS: clustercassandra-dc1-service.cassandra.svc.cluster.local
  CASSANDRA_PORT: "9042"
  CASSANDRA_LOCAL_FORWARD: "false"
  CASSANDRA_LOCAL_DATACENTER: dc1
  CASSANDRA_KEYSPACE: twitter
  STORAGE_S3_ENABLED: "true"
  STORAGE_S3_ENDPOINT: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
  STORAGE_S3_REGION: us-east-1
  STORAGE_S3_BUCKET: twitter
  CORS_ALLOWED_ORIGINS: http://localhost:5173
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitter-backend
  namespace: twitter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twitter-backend
  template:
    metadata:
      annotations:
        storage-s3-endpoint: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
      labels:
        app: twitter-backend
    spec:
      containers:
        - name: backend
          image: joacor7/twitter-api:v1 # {"$imagepolicy": "flux-system:twitter-backend"}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: twitter-backend-config
            - secretRef:
                name: twitter-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 65
---
apiVersion: v1
kind: Service
metadata:
  name: twitter-backend
  namespace: twitter
spec:
  selector:
    app: twitter-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
