# Gestionado por Flux. El Secret se administra fuera de Git.
apiVersion: v1
kind: Namespace
metadata:
  name: twitter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: twitter-backend-config
  namespace: twitter
data:
  SPRING_PROFILES_ACTIVE: prod,cassandra
  CASSANDRA_CONTACT_POINTS: clustercassandra-dc1-service.cassandra.svc.cluster.local
  CASSANDRA_PORT: "9042"
  CASSANDRA_LOCAL_FORWARD: "false"
  CASSANDRA_LOCAL_DATACENTER: dc1
  CASSANDRA_KEYSPACE: twitter
  STORAGE_S3_ENABLED: "true"
  STORAGE_S3_ENDPOINT: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
  STORAGE_S3_REGION: us-east-1
  STORAGE_S3_BUCKET: twitter
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080,http://10.66.50.3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitter-backend
  namespace: twitter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twitter-backend
  template:
    metadata:
      annotations:
        cors-allowed-origins: http://localhost:5173,http://localhost:8080,http://10.66.50.3
        storage-s3-endpoint: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
      labels:
        app: twitter-backend
    spec:
      # Agente de OpenTelemetry: métricas HTTP, JVM y Cassandra en :9464, sin cambiar el código de la app
      initContainers:
        - name: otel-agent
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.32.0
          command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: otel-agent
          emptyDir: {}
      containers:
        - name: backend
          image: joacor7/twitter-api:sha-7a01410fab2692a52befb38f9d4bd2405ac24635 
          ports:
            - name: http
              containerPort: 8080
            # Métricas del agente; no se expone en el Service LoadBalancer
            - name: otel-metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: twitter-backend-config
            - secretRef:
                name: twitter-backend-secrets
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -javaagent:/otel/javaagent.jar
            - name: OTEL_SERVICE_NAME
              value: twitter-backend
            - name: OTEL_METRICS_EXPORTER
              value: prometheus
            - name: OTEL_EXPORTER_PROMETHEUS_PORT
              value: "9464"
            # El SDK escucha por defecto solo en localhost; sin esto Prometheus no llega por la IP del pod
            - name: OTEL_EXPORTER_PROMETHEUS_HOST
              value: "0.0.0.0"
            - name: OTEL_TRACES_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            # Habilita las métricas de duración de las consultas a Cassandra
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: database
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 65
---
apiVersion: v1
kind: Service
metadata:
  name: twitter-backend
  namespace: twitter
  annotations:
    metallb.io/address-pool: twitter-pool
    metallb.io/loadBalancerIPs: 10.66.50.2
spec:
  type: LoadBalancer
  selector:
    app: twitter-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
