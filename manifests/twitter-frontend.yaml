# Gestionado por Flux. La imagen sirve el frontend en el puerto 80.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitter-frontend
  namespace: twitter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twitter-frontend
  template:
    metadata:
      labels:
        app: twitter-frontend
    spec:
      # La imagen está en GHCR de la org, que no permite packages públicos.
      # Secret creado a mano (PAT classic con read:packages), nunca en Git.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          image: ghcr.io/fing-middlewares-distribuidos-2026/grupo5-webapp:v1.0.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: twitter-frontend
  namespace: twitter
  annotations:
    metallb.io/address-pool: twitter-pool
    metallb.io/loadBalancerIPs: 10.66.51.52
spec:
  type: LoadBalancer
  selector:
    app: twitter-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
