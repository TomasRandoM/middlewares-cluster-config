{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "twitter-s3-gateway",
    "namespace": "seaweedfs"
  },
  "spec": {
    "selector": {
      "app.kubernetes.io/component": "s3",
      "app.kubernetes.io/instance": "seaweedfs",
      "app.kubernetes.io/name": "seaweedfs"
    },
    "ports": [
      {
        "name": "s3",
        "port": 8333,
        "targetPort": 8333
      }
    ]
  }
}
